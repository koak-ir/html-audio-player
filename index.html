<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نونیکا</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">

    <meta http-equiv="refresh" content="0; url=/m">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #FAF2E4;
            color: #2b1810;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .box {
            text-align: center;
        }

        img {
            width: 48px;
            margin-bottom: 18px;
            opacity: .9;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #EADFC9;
            border-top: 3px solid #681616;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            color: #93715a;
            font-size: 13px;
        }

        a {
            color: #681616;
            font-weight: 600;
        }
    </style>

    <script>
        window.location.replace("/m");
    </script>
</head>
<body>
<div class="box">
    <img src="/assets/logo.svg" alt="نونیکا">
    <div class="spinner"></div>
    <p>
        اگر منتقل نشدید،
        <a href="/m">اینجا کلیک کنید</a>.
    </p>
</div>
</body>
</html>
