<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qatrak ...</title>


    <meta http-equiv="refresh" content="0; url=/m">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #ddd;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .box {
            text-align: center;
            padding: 40px;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #171717;
            box-shadow: 0 0 30px rgba(0,0,0,.4);
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        a {
            color: #fff;
        }
    </style>

    <script>
        window.location.replace("/m");
    </script>
</head>
<body>
<div class="box">
    <div class="spinner"></div>
    <p>در حال انتقال...</p>
    <p style="margin-top:12px">
        اگر منتقل نشدید،
        <a href="/m">اینجا کلیک کنید</a>.
    </p>
</div>
</body>
</html>
