<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noonica.ir</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="/m/plyr.css">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Inter,sans-serif;
            background:linear-gradient(145deg,#2c1810,#1a0f0a,#0d0805);
            color:#f0e0d0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .container{
            width:900px;
            max-width:100%;
            background:linear-gradient(160deg,#3d231a,#2a1710,#1a0f0a);
            backdrop-filter:blur(15px);
            border:1px solid rgba(180,120,80,0.25);
            border-radius:24px;
            overflow:hidden;
            box-shadow:0 25px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(200,150,100,0.1);
        }

        .header{
            padding:28px 32px;
            border-bottom:1px solid rgba(180,120,80,0.15);
            background:linear-gradient(180deg,rgba(60,35,25,0.6),transparent);
        }

        .header h1{
            font-size:28px;
            font-weight:700;
            color:#f0d5c0;
            text-shadow:0 2px 10px rgba(0,0,0,0.5);
            letter-spacing:-0.5px;
        }

        .header h1 span{
            color:#d4a080;
        }

        .header p{
            margin-top:8px;
            color:#b8957a;
            font-size:14px;
            letter-spacing:0.3px;
        }

        audio{
            width:100%;
            margin-top:22px;
            background:#1a0f0a;
            border-radius:12px;
            height:54px;
        }

        audio::-webkit-media-controls-panel{
            background:linear-gradient(135deg,#2a1710,#1a0f0a);
            border-radius:12px;
            border:1px solid rgba(180,120,80,0.2);
        }

        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display{
            color:#d4a080;
        }

        audio::-webkit-media-controls-timeline{
            background:#3d231a;
            border-radius:4px;
        }

        audio::-webkit-media-controls-volume-slider{
            background:#3d231a;
            border-radius:4px;
        }

        .list{
            max-height:520px;
            overflow:auto;
            padding:6px 0;
        }

        .list::-webkit-scrollbar{
            width:6px;
        }

        .list::-webkit-scrollbar-track{
            background:transparent;
        }

        .list::-webkit-scrollbar-thumb{
            background:#5a3a2a;
            border-radius:20px;
        }

        .list::-webkit-scrollbar-thumb:hover{
            background:#7a4f3a;
        }

        .item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:16px 28px;
            cursor:pointer;
            transition:all 0.3s ease;
            border-bottom:1px solid rgba(180,120,80,0.06);
            position:relative;
        }

        .item:hover{
            background:linear-gradient(90deg,rgba(180,120,80,0.12),rgba(180,120,80,0.04));
            padding-right:34px;
        }

        .item.active{
            background:linear-gradient(90deg,#5a3a2a,rgba(90,58,42,0.6));
            border-right:4px solid #d4a080;
            box-shadow:inset 0 1px 0 rgba(200,150,100,0.1);
        }

        .item.active .item-name{
            color:#f0d5c0;
            font-weight:600;
        }

        .item-name{
            font-size:15px;
            color:#c9b09b;
            transition:color 0.3s;
            font-weight:400;
            letter-spacing:0.2px;
            display:flex;
            align-items:center;
            gap:12px;
        }

        .item-name::before{
            content:"♪";
            color:#5a3a2a;
            font-size:18px;
            transition:color 0.3s;
        }

        .item.active .item-name::before{
            color:#d4a080;
        }

        .play-icon{
            font-size:16px;
            color:#7a4f3a;
            transition:all 0.3s;
            width:24px;
            text-align:center;
        }

        .item.active .play-icon{
            color:#d4a080;
            transform:scale(1.1);
        }

        .item .track-number{
            color:#5a3a2a;
            font-size:13px;
            font-weight:600;
            margin-left:12px;
            min-width:24px;
        }

        .item.active .track-number{
            color:#d4a080;
        }

        .item.playing .play-icon{
            animation:pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse{
            0%,100%{opacity:1;transform:scale(1);}
            50%{opacity:0.5;transform:scale(0.9);}
        }


        .file-info{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .item::after{
            content:"";
            position:absolute;
            bottom:0;
            left:0;
            right:0;
            height:1px;
            background:linear-gradient(90deg,transparent,rgba(180,120,80,0.1),transparent);
            opacity:0;
            transition:opacity 0.3s;
        }

        .item:hover::after{
            opacity:1;
        }

        /* رنگی کردن نام فایل‌ها با پسوند */
        .item-name .ext{
            color:#5a3a2a;
            font-size:12px;
            font-weight:300;
        }

        .item.active .ext{
            color:#b07a5a;
        }

        .track-count{
            font-size:12px;
            color:#5a3a2a;
            background:rgba(90,58,42,0.3);
            padding:2px 12px;
            border-radius:20px;
            border:1px solid rgba(180,120,80,0.1);
        }


        @keyframes slideIn{
            from{opacity:0;transform:translateY(-8px);}
            to{opacity:1;transform:translateY(0);}
        }

        .item{
            animation:slideIn 0.3s ease forwards;
        }

        .item:nth-child(1){animation-delay:0.05s;}
        .item:nth-child(2){animation-delay:0.1s;}
        .item:nth-child(3){animation-delay:0.15s;}
        .item:nth-child(4){animation-delay:0.2s;}
        .item:nth-child(5){animation-delay:0.25s;}
        .item:nth-child(6){animation-delay:0.3s;}
        .item:nth-child(7){animation-delay:0.35s;}
        .item:nth-child(8){animation-delay:0.4s;}
        .item:nth-child(9){animation-delay:0.45s;}
        .item:nth-child(10){animation-delay:0.5s;}

        :root{

            --plyr-color-main:#b97a56;

            --plyr-audio-controls-background:#24140e;

            --plyr-menu-background:#2b1b13;

            --plyr-tooltip-background:#b97a56;

            --plyr-tooltip-color:#fff;

            --plyr-range-fill-background:#b97a56;

            --plyr-range-thumb-background:#fff;

            --plyr-control-icon-size:18px;

        }

        .plyr{

            border-radius:18px;
            overflow:hidden;
            margin-top:20px;
        }

        .plyr--audio{

            background:#24140e;
            box-shadow:
                    inset 0 0 30px rgba(255,255,255,.02),
                    0 15px 40px rgba(0,0,0,.5);

            border:1px solid rgba(255,255,255,.05);
        }

        .plyr__controls{

            padding:18px;
        }

        .plyr__control:hover{

            background:#b97a56 !important;
        }

        .plyr__progress__buffer{

            color:#3b2a22;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="header">
        <h1>🎵 <span>Noonica</span></h1>
        <p>🎧 برای پخش، روی هر آهنگ کلیک کنید</p>


        <audio id="player"></audio>
    </div>

    <div class="list" id="playlist"></div>

</div>

<script>


    const files = [
        { src: "/audio/m01.mp3", name: "آهنگ شماره یک" },
        { src: "/audio/m02.mp3", name: "آهنگ شماره دو" },
        { src: "/audio/m03.mp3", name: "آهنگ شماره سه" },
        { src: "/audio/m04.mp3", name: "آهنگ شماره چهار" },
        { src: "/audio/m05.mp3", name: "آهنگ شماره پنج" },
        { src: "/audio/m06.mp3", name: "آهنگ شماره شش" },
        { src: "/audio/m07.mp3", name: "آهنگ شماره هفت" },
        { src: "/audio/m08.mp3", name: "آهنگ شماره هشت" },
        { src: "/audio/m09.mp3", name: "آهنگ شماره نه" },
        { src: "/audio/m10.mp3", name: "آهنگ شماره ده" },
    ];

    const player = document.getElementById("player");
    const playlist = document.getElementById("playlist");
    let currentIndex = 0;

    function load(index){

        if(index < 0 || index >= files.length) return;

        currentIndex = index;
        player.src = files[index].src;
        player.play();


        document.querySelectorAll(".item").forEach((x, i) => {
            x.classList.remove("active", "playing");
            if(i === index) {
                x.classList.add("active", "playing");
            }
        });
    }


    files.forEach((file, index) => {

        const div = document.createElement("div");
        div.className = "item";
        div.id = "track-" + index;


        const ext = file.src.split('.').pop();

        div.innerHTML = `
        <div class="file-info">
            <span class="track-number">${String(index + 1).padStart(2, '0')}</span>
            <div class="item-name">
                ${file.name}
                <span class="ext">.${ext}</span>
            </div>
        </div>
        <div class="play-icon">▶</div>
    `;

        div.onclick = () => load(index);
        playlist.appendChild(div);

    });


    load(0);


    player.addEventListener("ended", () => {
        let next = currentIndex + 1;
        if(next >= files.length) next = 0;
        load(next);
    });


    player.addEventListener("play", () => {
        document.querySelectorAll(".item").forEach(x => x.classList.remove("playing"));
        const active = document.querySelector(".item.active");
        if(active) active.classList.add("playing");
    });

    player.addEventListener("pause", () => {
        document.querySelectorAll(".item").forEach(x => x.classList.remove("playing"));
    });


    player.addEventListener("play", () => {
        const currentFile = files[currentIndex];
        if(currentFile) {
            document.title = `🎵 ${currentFile.name} - QaTrak Audio`;
        }
    });


</script>

<script src="/m/plyr.js"></script>
</body>
<script>

    const plyr = new Plyr('#player', {

        controls: [
            // 'play-large',
            // 'restart',
            // 'rewind',
            'play',
            // 'fast-forward',
            'progress',
            // 'current-time',
            // 'duration',
            // 'mute',
            // 'volume',
            // 'settings'
        ],

        settings: [
            'speed'
        ],

        speed: {
            selected: 1,
            options: [0.5,0.75,1,1.25,1.5,2]
        }

    });

</script>
</html>
